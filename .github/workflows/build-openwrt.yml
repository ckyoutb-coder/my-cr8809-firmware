name: Build-CR8809-PassWall

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/hzyitc/openwrt-redmi-ax3000
  REPO_BRANCH: master   # 或 ipq50xx-mainline-kernel-5.15-openwrt-23.05，看 releases 最新稳定分支
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Init Environment
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install $(curl -fsSL https://is.gd/depends_ubuntu_2204)
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"

    - name: Clone Source
      run: |
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
        cd openwrt
        # 添加 passwall feed（这个仓库 feeds.conf.default 可能已有部分，但我们追加确保）
        echo "" >> feeds.conf.default
        echo "src-git passwall https://github.com/xiaorouji/openwrt-passwall" >> feeds.conf.default

    - name: Update Feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Generate Custom Config
      run: |
        cd openwrt
        cat > .config << 'EOF'
        CONFIG_TARGET_ipq50xx=y
        CONFIG_TARGET_ipq50xx_arm=y
        CONFIG_TARGET_ipq50xx_arm_DEVICE_redmi_ax3000=y   # 这个仓库常用 redmi_ax3000
        # 或试试 CONFIG_TARGET_ipq50xx_arm_DEVICE_xiaomi_redmi-router-ax3000=y 如果上面不行
        CONFIG_PACKAGE_luci=y
        CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
        CONFIG_PACKAGE_luci-app-passwall=y
        CONFIG_PACKAGE_luci-i18n-passwall-zh-cn=y
        # 关闭不必要包，节省时间/空间
        # CONFIG_PACKAGE_luci-app-access-control is not set
        # CONFIG_PACKAGE_luci-app-upnp is not set
        EOF
        make defconfig

    - name: Download Dl Package
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -delete

    - name: Compile
      run: |
        cd openwrt
        make -j$(nproc) || make -j1 V=s

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: CR8809_Firmware
        path: openwrt/bin/targets/ipq50xx/arm/*.bin openwrt/bin/targets/ipq50xx/arm/*.ubi openwrt/bin/targets/ipq50xx/arm/*factory*  # 覆盖常见输出
        if-no-files-found: warn
